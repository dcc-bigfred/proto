name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  go-test:
    name: Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache-dependency-path: go/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go run gotest.tools/gotestsum@latest --junitfile "${{ github.workspace }}/go-junit.xml" --format pkgname -- -count=1 ./...

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-go
          path: go-junit.xml
          if-no-files-found: ignore

  rust-test:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Test
        run: cargo nextest run --workspace --exclude dcc-proto-interop --profile ci

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-rust
          path: rust/target/nextest/ci/junit.xml
          if-no-files-found: ignore

  rust-nostd:
    name: Rust no_std
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf, riscv32imac-unknown-none-elf

      - name: Thumb
        run: cargo build -p dcc-proto-z21 -p dcc-proto-withrottle --target thumbv7em-none-eabihf

      - name: RISC-V
        run: cargo build -p dcc-proto-z21 -p dcc-proto-withrottle --target riscv32imac-unknown-none-elf

  interop:
    name: Interop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache-dependency-path: go/go.sum

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Build loopback host
        working-directory: go
        run: mkdir -p ../rust/target && go build -o ../rust/target/loopback-host ./cmd/loopback-host

      - name: Rust client against Go Listen
        working-directory: rust
        env:
          PROTO_LOOPBACK_HOST: ${{ github.workspace }}/rust/target/loopback-host
        run: cargo nextest run -p dcc-proto-interop --profile interop --test-threads=1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-interop
          path: rust/target/nextest/interop/junit.xml
          if-no-files-found: ignore

  vectors-fresh:
    name: Vectors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache-dependency-path: go/go.sum

      - name: Generate
        working-directory: go
        run: go run ./cmd/gen-vectors

      - name: Unchanged
        run: git diff --exit-code testdata

  test-report:
    name: Test report
    runs-on: ubuntu-latest
    needs: [go-test, rust-test, interop]
    if: always()
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: write
    steps:
      - name: Download test results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: test-results-*
          path: reports

      - name: Publish
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: Test results
          comment_title: Test results
          files: reports/**/*.xml
