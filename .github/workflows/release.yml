name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  crates-io:
    name: crates.io and GitHub Release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Discover publishable crates
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.publish != []) | .name' \
            | sort > "${{ github.workspace }}/publish-crates.txt"
          if [ ! -s "${{ github.workspace }}/publish-crates.txt" ]; then
            echo "No publishable crates" >&2
            exit 1
          fi
          echo "Publishing:"
          cat "${{ github.workspace }}/publish-crates.txt"

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          while IFS= read -r crate; do
            [ -z "$crate" ] && continue
            cargo publish -p "$crate" --locked
          done < "${{ github.workspace }}/publish-crates.txt"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          {
            echo "Published to crates.io:"
            echo
            while IFS= read -r crate; do
              [ -z "$crate" ] && continue
              echo "- https://crates.io/crates/${crate}"
            done < publish-crates.txt
          } > /tmp/release-extra.md
          gh release create "${{ github.ref_name }}" --generate-notes
          body="$(gh release view "${{ github.ref_name }}" --json body --jq .body)"
          printf '%s\n\n%s\n' "$body" "$(cat /tmp/release-extra.md)" > /tmp/release-body.md
          gh release edit "${{ github.ref_name }}" --notes-file /tmp/release-body.md
