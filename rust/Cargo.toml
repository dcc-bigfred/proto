[workspace]
resolver = "2"
members = ["z21", "withrottle"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"

[workspace.dependencies]
heapless = { version = "0.8", default-features = false }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
