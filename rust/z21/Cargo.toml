[package]
name = "dcc-bigfred-proto-z21"
description = "Z21 LAN client protocol (no_std, no alloc)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["dcc", "z21", "model-railroad", "no-std"]
categories = ["embedded", "encoding"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE", "logo.png"]

[lints]
workspace = true

[features]
default = []
railcom = ["dep:dcc-bigfred-proto-railcom"]

[dependencies]
heapless.workspace = true
dcc-bigfred-proto-railcom = { workspace = true, optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
